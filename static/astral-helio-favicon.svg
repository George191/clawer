<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Astral Helio Ring Mark</title>
  <desc id="desc">Astral Helio logo with a fitted white background.</desc>
  <defs>
    <linearGradient id="ah-ring" x1="10" y1="8" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF6FF"/>
      <stop offset="0.42" stop-color="#3FE3A6"/>
      <stop offset="1" stop-color="#5572F7"/>
    </linearGradient>
    <linearGradient id="ah-core" x1="25" y1="24" x2="70" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF076"/>
      <stop offset="0.46" stop-color="#39E5C0"/>
      <stop offset="1" stop-color="#2D7FF9"/>
    </linearGradient>
    <clipPath id="ah-ring-cut">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M48 91C71.7482 91 91 71.7482 91 48C91 24.2518 71.7482 5 48 5C24.2518 5 5 24.2518 5 48C5 71.7482 24.2518 91 48 91ZM48 79C65.1208 79 79 65.1208 79 48C79 30.8792 65.1208 17 48 17C30.8792 17 17 30.8792 17 48C17 65.1208 30.8792 79 48 79Z"/>
    </clipPath>
    <filter id="ah-glow" x="9" y="9" width="78" height="78" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="ah-ring-white-background" x="-16" y="-16" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="soft-expanded"/>
      <feComponentTransfer in="soft-expanded" result="rounded-expanded">
        <feFuncA type="linear" slope="10" intercept="-0.35"/>
      </feComponentTransfer>
      <feFlood flood-color="#FFFFFF" result="white"/>
      <feComposite in="white" in2="rounded-expanded" operator="in"/>
    </filter>
  </defs>

  <!-- 中心透明区域填充为白色，并与圆环白底相互重叠。 -->
  <circle cx="48" cy="48" r="38" fill="#FFFFFF"/>

  <!-- 白边基于渐变圆环的实际三段弧线生成，不受内部光晕影响。 -->
  <g filter="url(#ah-ring-white-background)">
    <g clip-path="url(#ah-ring-cut)">
      <path d="M16.6 56.5C23.3 76.3 48.9 86.9 69.1 77.3C89.2 67.8 98.2 44.2 87 25.5" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M13.4 38.7C20.1 19.4 42 9.3 61.9 14.5C81.8 19.8 94.6 39.5 90.4 60.8" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M22.4 74.8C7.6 57.4 7.9 32.6 23.3 16.4" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <g id="mark">
    <circle cx="48" cy="48" r="31" fill="url(#ah-core)" opacity="0.18" filter="url(#ah-glow)"/>
    <g clip-path="url(#ah-ring-cut)">
      <path d="M16.6 56.5C23.3 76.3 48.9 86.9 69.1 77.3C89.2 67.8 98.2 44.2 87 25.5" stroke="url(#ah-ring)" stroke-width="8" stroke-linecap="round"/>
      <path d="M13.4 38.7C20.1 19.4 42 9.3 61.9 14.5C81.8 19.8 94.6 39.5 90.4 60.8" stroke="#2449D8" stroke-width="7" stroke-linecap="round" opacity="0.86"/>
      <path d="M22.4 74.8C7.6 57.4 7.9 32.6 23.3 16.4" stroke="#20D59B" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
    </g>
    <path d="M29.6 58.8L42.6 37.6L61.1 43.1L67.8 62.4L46.4 68.8L29.6 58.8Z" stroke="#102033" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42.6 37.6L46.4 68.8M61.1 43.1L29.6 58.8" stroke="#102033" stroke-width="2.35" stroke-linecap="round" opacity="0.68"/>
    <circle cx="29.6" cy="58.8" r="5.6" fill="#102033"/>
    <circle cx="42.6" cy="37.6" r="5.6" fill="#102033"/>
    <circle cx="61.1" cy="43.1" r="5.6" fill="#102033"/>
    <circle cx="67.8" cy="62.4" r="5.6" fill="#102033"/>
    <circle cx="46.4" cy="68.8" r="5.6" fill="#102033"/>
    <circle cx="42.6" cy="37.6" r="2.15" fill="#FFF076"/>
    <circle cx="61.1" cy="43.1" r="2.15" fill="#39E5C0"/>
    <circle cx="29.6" cy="58.8" r="2.15" fill="#7DF6FF"/>
    <circle cx="67.8" cy="62.4" r="2.15" fill="#66E6A6"/>
    <circle cx="46.4" cy="68.8" r="2.15" fill="#5572F7"/>
    <path d="M48 22.5L51.8 34L63.3 37.8L51.8 41.6L48 53.1L44.2 41.6L32.7 37.8L44.2 34L48 22.5Z" fill="#FFF6A3"/>
    <path d="M75 22.2L77 27.4L82.2 29.4L77 31.4L75 36.6L73 31.4L67.8 29.4L73 27.4L75 22.2Z" fill="#2D7FF9"/>
  </g>
</svg>
