# ====================================================================
# Spider — 4 App Services + N Infrastructure Services
#
#  App Services:
#    1. crawler     — 采集：爬取数据，保存到 MongoDB
#    2. downloader  — 下载：监听 MongoDB，下载资源到 MinIO
#    3. syncer      — 同步：监听 MongoDB，推送已下载数据到 Kafka
#    4. web         — Web 管理面板 (FastAPI)
#
#  Infrastructure:
#    mongodb, redis, minio, kafka, postgres
#
#  ETL Pipeline:
#    rds-worker  — 原始数据入库
#    ods-worker  — 数据标准化
#    ads-worker  — 算法分析
# ====================================================================

services:
  # ════════════════════════════════════════════════════════════
  # Infrastructure Services
  # ════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════
  # App Services
  # ════════════════════════════════════════════════════════════

  # ── 1. Crawler — 采集服务 ─────────────────────────────────
  crawler:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=${SPIDER_CELERY_CONCURRENCY:-5}
    deploy:
      replicas: ${SPIDER_CELERY_WORKER_REPLICAS:-1}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - asiral-helio

  celery-beat:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - celerybeat-data:/data
    working_dir: /app
    command: celery -A app.scheduler.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    networks:
      - asiral-helio

  # ── 2. Downloader — 下载服务 ──────────────────────────────
  downloader:
    build:
      context: .
      dockerfile: docker/downloader.Dockerfile
    container_name: downloader
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: ["python", "-m", "app.downloader.main", "--poll", "10"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - asiral-helio

  # ── 3. Syncer — Kafka 同步服务 ────────────────────────────
  syncer:
    build:
      context: .
      dockerfile: docker/syncer.Dockerfile
    container_name: syncer
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: ["python", "-m", "app.syncer.main", "--poll", "10", "--startup-delay", "15"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - asiral-helio

  # ── 4. Web — FastAPI 管理面板 ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    working_dir: /app
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - asiral-helio

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${SPIDER_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - asiral-helio

  # ════════════════════════════════════════════════════════════
  # ETL Infrastructure — Postgres + ETL Pipeline
  # ════════════════════════════════════════════════════════════

  # ── RDS Worker — 原始数据存储层 ─────────────────────────────
  rds-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: rds-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPIDER_KAFKA_BROKERS: "kafka:9092"
      SPIDER_KAFKA_TOPIC: "${SPIDER_KAFKA_TOPIC:-spider-crawler}"
      SPIDER_PG_URL: "postgresql+asyncpg://${SPIDER_PG_USER:-postgres}:${SPIDER_PG_PASS:-postgres}@postgres:5432/${SPIDER_PG_DB:-spider_etl}"
      SPIDER_ETL_RAW_TOPIC: "${SPIDER_KAFKA_TOPIC:-spider-crawler}"
      SPIDER_ETL_RDS_TOPIC: "${SPIDER_ETL_RDS_TOPIC:-spider-rds-processed}"
      SPIDER_ETL_RDS_CONSUMER_GROUP: "${SPIDER_ETL_RDS_CONSUMER_GROUP:-spider-rds-group}"
    working_dir: /app
    command: >
      sh -c "python -m app.etl.main --init-schema &&
             python -m app.etl.main --layer rds"
    networks:
      - asiral-helio

  # ── ODS Worker — 操作数据存储层（标准化）──────────────────────
  ods-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: ods-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rds-worker:
        condition: service_started
    env_file:
      - .env
    environment:
      SPIDER_KAFKA_BROKERS: "kafka:9092"
      SPIDER_PG_URL: "postgresql+asyncpg://${SPIDER_PG_USER:-postgres}:${SPIDER_PG_PASS:-postgres}@postgres:5432/${SPIDER_PG_DB:-spider_etl}"
      SPIDER_ETL_RDS_TOPIC: "${SPIDER_ETL_RDS_TOPIC:-spider-rds-processed}"
      SPIDER_ETL_ODS_TOPIC: "${SPIDER_ETL_ODS_TOPIC:-spider-ods-processed}"
      SPIDER_ETL_ODS_CONSUMER_GROUP: "${SPIDER_ETL_ODS_CONSUMER_GROUP:-spider-ods-group}"
    working_dir: /app
    command: python -m app.etl.main --layer ods
    networks:
      - asiral-helio

