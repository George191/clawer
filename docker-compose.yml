# ====================================================================
# Spider - application services with external infrastructure
#
#  App Services:
#    1. crawler     — 采集：爬取数据，保存到 MongoDB
#    2. downloader  — 下载：消费 Mongo CDC，MongoDB 补偿，资源写入 MinIO
#    3. syncer      — 同步：消费 Mongo CDC 并发送业务 Kafka 消息，MongoDB 补偿
#    4. web         — Web 管理面板 (FastAPI)
#
#  Infrastructure connections are loaded from .env.
#
#  ETL Pipeline:
#    rds-worker  — 原始数据入库
#    ods-worker  — 数据标准化
#    ads-worker  — 算法分析
# ====================================================================

services:
  # Explicitly enabled during the Mongo CDC migration; brokers/Mongo remain external.
  mongo-cdc-connect:
    image: quay.io/debezium/connect:3.4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./docker/mongo-cdc-connect.sh:/mongo-cdc-connect.sh:ro
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    entrypoint: ["bash", "/mongo-cdc-connect.sh"]
    networks:
      - asiral-helio

  postgres-cdc-syncer:
    build:
      context: .
      dockerfile: docker/syncer.Dockerfile
    container_name: postgres-cdc-syncer
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: ["python", "-m", "app.syncer.postgres_worker", "--batch", "50"]
    networks:
      - asiral-helio

  # ════════════════════════════════════════════════════════════
  # External infrastructure is reached through the IPs or hostnames in .env.
  # ════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════
  # App Services
  # ════════════════════════════════════════════════════════════

  # ── 1. Crawler — 采集服务 ─────────────────────────────────
  crawler:
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - "timeout:3"
      - "attempts:2"
    network_mode: host
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - crawler-incremental-data:/app/data/incremental
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=${SPIDER_CELERY_CONCURRENCY:-5}
    deploy:
      replicas: ${SPIDER_CELERY_WORKER_REPLICAS:-1}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # networks:
    #   - asiral-helio

  celery-beat:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - celerybeat-data:/data
    working_dir: /app
    command: celery -A app.scheduler.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    networks:
      - asiral-helio

  # ── 2. Downloader — 下载服务 ──────────────────────────────
  scheduler-worker: &scheduler-worker
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: scheduler-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=1 --queues=scheduler
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - asiral-helio

  search-worker:
    <<: *scheduler-worker
    container_name: search-worker
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=1 --queues=web-search

  downloader:
    build:
      context: .
      dockerfile: docker/downloader.Dockerfile
    container_name: downloader
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: ["python", "-m", "app.downloader.main", "--poll", "60"]
    networks:
      - asiral-helio

  # ── 3. Syncer — Kafka 同步服务 ────────────────────────────
  syncer:
    build:
      context: .
      dockerfile: docker/syncer.Dockerfile
    container_name: syncer
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: ["python", "-m", "app.syncer.main", "--batch", "50", "--concurrency", "10", "--poll", "60", "--startup-delay", "15"]
    networks:
      - asiral-helio

  # ── 4. Web — FastAPI 管理面板 ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        INSTALL_CHROMIUM: "true"
    container_name: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./models:/app/models:ro
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    working_dir: /app
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); r.raise_for_status(); assert r.json()['data']['status'] == 'healthy'"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - asiral-helio

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${SPIDER_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - asiral-helio

  # ════════════════════════════════════════════════════════════
  # ETL Pipeline
  # ════════════════════════════════════════════════════════════

  # ── RDS Worker — 原始数据存储层 ─────────────────────────────
  rds-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: rds-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: >
      sh -c "python -m app.etl.main --init-schema &&
             python -m app.etl.main --layer rds"
    networks:
      - asiral-helio

  # ── ODS Worker — 操作数据存储层（标准化）──────────────────────
  ods-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: ods-worker
    restart: unless-stopped
    depends_on:
      rds-worker:
        condition: service_started
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: python -m app.etl.main --layer ods
    networks:
      - asiral-helio

  # ── TASK Worker — 卫星漏洞抽取 ─────────────────────────────────
  task-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: task-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: python -m app.etl.main --layer task --table vulnerability
    networks:
      - asiral-helio

