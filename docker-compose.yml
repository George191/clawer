# ====================================================================
# Spider - application services with external infrastructure
#
#  App Services:
#    1. crawler     — 采集：爬取数据，保存到 MongoDB
#    2. downloader  — 下载：监听 MongoDB，下载资源到 MinIO
#    3. syncer      — 同步：监听 MongoDB，推送已下载数据到 Kafka
#    4. web         — Web 管理面板 (FastAPI)
#
#  Infrastructure connections are loaded from .env.
#
#  ETL Pipeline:
#    rds-worker  — 原始数据入库
#    ods-worker  — 数据标准化
#    ads-worker  — 算法分析
# ====================================================================

services:
  # ════════════════════════════════════════════════════════════
  # External infrastructure is reached through the IPs or hostnames in .env.
  # ════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════
  # App Services
  # ════════════════════════════════════════════════════════════

  # ── 1. Crawler — 采集服务 ─────────────────────────────────
  crawler:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - "timeout:3"
      - "attempts:2"
    network_mode: host
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=${SPIDER_CELERY_CONCURRENCY:-5}
    deploy:
      replicas: ${SPIDER_CELERY_WORKER_REPLICAS:-1}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # networks:
    #   - asiral-helio

  celery-beat:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - celerybeat-data:/data
    working_dir: /app
    command: celery -A app.scheduler.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    networks:
      - asiral-helio

  # ── 2. Downloader — 下载服务 ──────────────────────────────
  scheduler-worker:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: scheduler-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    working_dir: /app
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=1 --queues=scheduler
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  downloader:
    build:
      context: .
      dockerfile: docker/downloader.Dockerfile
    container_name: downloader
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: ["python", "-m", "app.downloader.main", "--poll", "10"]
    networks:
      - asiral-helio

  # ── 3. Syncer — Kafka 同步服务 ────────────────────────────
  syncer:
    build:
      context: .
      dockerfile: docker/syncer.Dockerfile
    container_name: syncer
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: ["python", "-m", "app.syncer.main", "--poll", "10", "--startup-delay", "15"]
    networks:
      - asiral-helio

  # ── 4. Web — FastAPI 管理面板 ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    working_dir: /app
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); r.raise_for_status(); assert r.json()['data']['status'] == 'healthy'"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - asiral-helio

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${SPIDER_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - asiral-helio

  # ════════════════════════════════════════════════════════════
  # ETL Pipeline
  # ════════════════════════════════════════════════════════════

  # ── RDS Worker — 原始数据存储层 ─────────────────────────────
  rds-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: rds-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "python -m app.etl.main --init-schema &&
             python -m app.etl.main --layer rds"
    networks:
      - asiral-helio

  # ── ODS Worker — 操作数据存储层（标准化）──────────────────────
  ods-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: ods-worker
    restart: unless-stopped
    depends_on:
      rds-worker:
        condition: service_started
    env_file:
      - .env
    working_dir: /app
    command: python -m app.etl.main --layer ods
    networks:
      - asiral-helio

