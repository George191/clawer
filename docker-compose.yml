# ====================================================================
# Spider - application services with external infrastructure
#
#  App Services:
#    1. crawler     — 采集：爬取数据，保存到 MongoDB
#    2. downloader  — 下载：消费 Mongo CDC，MongoDB 补偿，资源写入 MinIO
#    3. syncer      — 同步：消费 Mongo CDC 并发送业务 Kafka 消息，MongoDB 补偿
#    4. web         — Web 管理面板 (FastAPI)
#
#  Infrastructure connections are loaded from .env.
#
#  ETL Pipeline:
#    rds-worker  — 原始数据入库
#    ods-worker  — 数据标准化
#    ads-worker  — 算法分析
# ====================================================================

services:
  # Explicitly enabled during the Mongo CDC migration; brokers/Mongo remain external.
  mongo-cdc-syncer:
    image: quay.io/debezium/connect:3.4
    container_name: mongo-cdc-syncer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./docker/mongo-cdc-connect.sh:/mongo-cdc-connect.sh:ro
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    entrypoint: ["bash", "/mongo-cdc-connect.sh"]
    networks:
      astral-helio:
        aliases:
          - mongo-cdc-connect

  postgres-cdc-syncer:
    build:
      context: .
      dockerfile: docker/syncer.Dockerfile
    container_name: postgres-cdc-syncer
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: ["python", "-m", "app.syncer.postgres_worker", "--batch", "50"]
    networks:
      - astral-helio

  # ════════════════════════════════════════════════════════════
  # External infrastructure is reached through the IPs or hostnames in .env.
  # ════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════
  # App Services
  # ════════════════════════════════════════════════════════════

  # ── 1. Crawler — 采集服务 ─────────────────────────────────
  crawler:
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - "timeout:3"
      - "attempts:2"
    network_mode: host
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - crawler-incremental-data:/app/data/incremental
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=${SPIDER_CELERY_CONCURRENCY:?SPIDER_CELERY_CONCURRENCY must be set in .env}
    deploy:
      replicas: ${SPIDER_CELERY_WORKER_REPLICAS:?SPIDER_CELERY_WORKER_REPLICAS must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    # networks:
    #   - astral-helio

  celery-beat:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - celerybeat-data:/data
    working_dir: /app
    command: celery -A app.scheduler.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    networks:
      - astral-helio

  # ── 2. Downloader — 下载服务 ──────────────────────────────
  scheduler-worker: &scheduler-worker
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    container_name: scheduler-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=1 --queues=scheduler
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scheduler.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - astral-helio

  search-worker:
    <<: *scheduler-worker
    container_name: search-worker
    command: celery -A app.scheduler.celery_app worker --loglevel=info --concurrency=1 --queues=web-search

  downloader:
    build:
      context: .
      dockerfile: docker/downloader.Dockerfile
    container_name: downloader
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    env_file:
      - .env
    environment:
      SPIDER_PROXY_PRE_PROXY_URL: socks5h://172.18.0.1:1080
      SPIDER_DOWNLOAD_ASSET_CONCURRENCY: "128"
    extra_hosts:
      - "mongo.spider.internal:192.168.1.32"
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
      - ./output/downloader-tmp:/tmp
    command: ["python", "-m", "app.downloader.main", "--poll", "60", "--batch", "128"]
    networks:
      - astral-helio

  # ── 3. Syncer — Kafka 同步服务 ────────────────────────────
  syncer:
    build:
      context: .
      dockerfile: docker/syncer.Dockerfile
    container_name: syncer
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: ["python", "-m", "app.syncer.main", "--batch", "50", "--concurrency", "10", "--poll", "60", "--startup-delay", "15"]
    networks:
      - astral-helio

  # ── 4. Web — FastAPI 管理面板 ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        INSTALL_CHROMIUM: "true"
    container_name: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SPIDER_KAFKA_SSL_CAFILE: ${SPIDER_KAFKA_SSL_CAFILE:-/etc/kafka/kafka.crt}
      SPIDER_CDC_CONNECT_URL: ${SPIDER_CDC_CONNECT_URL:-http://mongo-cdc-connect:8083}
      API_V1_STR: /v1
      FRONTEND_HOST: https://app.${FRONTEND_DOMAIN_SUFFIX:?FRONTEND_DOMAIN_SUFFIX must be set in .env}:${SPIDER_HTTPS_PORT:-443}
      BACKEND_CORS_ORIGINS: https://app.${FRONTEND_DOMAIN_SUFFIX}:${SPIDER_HTTPS_PORT:-443}
    extra_hosts:
      - "mongo.spider.internal:192.168.1.32"
    volumes:
      - ./output:/app/output
      - ./models:/app/models:ro
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    working_dir: /app
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); r.raise_for_status(); assert r.json()['data']['status'] == 'healthy'"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - astral-helio

  dns:
    image: coredns/coredns:1.15.0
    profiles: [dns]
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      FRONTEND_DOMAIN_SUFFIX: ${FRONTEND_DOMAIN_SUFFIX:?FRONTEND_DOMAIN_SUFFIX must be set in .env}
      BACKEND_DOMAIN_SUFFIX: ${BACKEND_DOMAIN_SUFFIX:?BACKEND_DOMAIN_SUFFIX must be set in .env}
      SPIDER_DNS_TARGET_IPV4: ${SPIDER_DNS_TARGET_IPV4:-}
      SPIDER_DNS_UPSTREAM: ${SPIDER_DNS_UPSTREAM:-223.5.5.5}
    ports:
      - "${SPIDER_DNS_TARGET_IPV4:-127.0.0.1}:53:53/udp"
      - "${SPIDER_DNS_TARGET_IPV4:-127.0.0.1}:53:53/tcp"
    volumes:
      - ./docker/Corefile:/etc/coredns/Corefile:ro
    networks:
      - astral-helio

  tls-init:
    build:
      context: .
      dockerfile: docker/tls.Dockerfile
    restart: "no"
    environment:
      FRONTEND_DOMAIN_SUFFIX: ${FRONTEND_DOMAIN_SUFFIX:?FRONTEND_DOMAIN_SUFFIX must be set in .env}
      BACKEND_DOMAIN_SUFFIX: ${BACKEND_DOMAIN_SUFFIX:?BACKEND_DOMAIN_SUFFIX must be set in .env}
    volumes:
      - ontology-ca:/ca
      - ontology-tls:/certs

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    environment:
      FRONTEND_DOMAIN_SUFFIX: ${FRONTEND_DOMAIN_SUFFIX:?FRONTEND_DOMAIN_SUFFIX must be set in .env}
      BACKEND_DOMAIN_SUFFIX: ${BACKEND_DOMAIN_SUFFIX:?BACKEND_DOMAIN_SUFFIX must be set in .env}
      SPIDER_HTTPS_PORT: ${SPIDER_HTTPS_PORT:-443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^(FRONTEND_DOMAIN_SUFFIX|BACKEND_DOMAIN_SUFFIX|HTTPS_REDIRECT_PORT)$
    ports:
      - "${SPIDER_HTTP_PORT:?SPIDER_HTTP_PORT must be set in .env}:80"
      - "${SPIDER_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./docker/nginx-runtime.envsh:/docker-entrypoint.d/19-runtime-config.envsh:ro
      - ontology-tls:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - astral-helio

  # ════════════════════════════════════════════════════════════
  # ETL Pipeline
  # ════════════════════════════════════════════════════════════

  # ── RDS Worker — 原始数据存储层 ─────────────────────────────
  rds-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: rds-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: >
      sh -c "python -m app.etl.main --init-schema &&
             python -m app.etl.main --layer rds"
    networks:
      - astral-helio

  # ── ODS Worker — 操作数据存储层（标准化）──────────────────────
  ods-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: ods-worker
    restart: unless-stopped
    depends_on:
      rds-worker:
        condition: service_started
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: python -m app.etl.main --layer ods
    networks:
      - astral-helio

  # ── TASK Worker — 卫星漏洞抽取 ─────────────────────────────────
  task-worker:
    build:
      context: .
      dockerfile: docker/etl.Dockerfile
    container_name: task-worker
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./docker/kafka.crt:/etc/kafka/kafka.crt:ro
    command: python -m app.etl.main --layer task --table vulnerability
    networks:
      - astral-helio

