# Kafka SASL/PLAIN 认证配置文件
#
# 用户名: kafkadmin
# 密码: kafkadmin
#
# 用法: 挂载到 Kafka 容器的 /etc/kafka/kafka_server_jaas.conf
#       在 docker-compose.yml 中通过 KAFKA_OPTS 引用

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="kafkadmin"
    password="kafkadmin"
    user_kafkadmin="kafkadmin";
};

Client {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="kafkadmin"
    password="kafkadmin";
};
