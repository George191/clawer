events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream spider_web {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 100m;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Keep API and WebSocket traffic separate from the client-side SPA.
        # The web container may be running an older build without a history
        # fallback, so page refreshes are recovered here at the edge.
        location ~ ^/(?:api|ws)(?:/|$) {
            proxy_pass http://spider_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://spider_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # A browser route such as /ai-collect?panel=tasks must resolve to
            # the SPA entry point when the upstream returns a route-level 404.
            proxy_intercept_errors on;
            error_page 404 = /__spa_fallback;
        }

        location = /__spa_fallback {
            internal;
            proxy_pass http://spider_web/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
