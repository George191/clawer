<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Astral Helio A</title>
  <desc id="desc">A luminous gradient letter A on a deep interface-style background.</desc>
  <defs>
    <linearGradient id="ah-a-gradient" x1="18" y1="16" x2="80" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF6FF"/>
      <stop offset="0.42" stop-color="#3FE3A6"/>
      <stop offset="1" stop-color="#5572F7"/>
    </linearGradient>
    <radialGradient id="ah-surface" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(34 25) rotate(55) scale(73)">
      <stop stop-color="#242B3A"/>
      <stop offset="0.58" stop-color="#171B25"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </radialGradient>
    <linearGradient id="ah-edge" x1="14" y1="12" x2="82" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF6FF" stop-opacity="0.52"/>
      <stop offset="0.48" stop-color="#3FE3A6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5572F7" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="ah-a-glow" x="7" y="6" width="82" height="84" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="45" fill="url(#ah-surface)"/>
  <circle cx="48" cy="48" r="44" stroke="url(#ah-edge)" stroke-width="2"/>

  <g opacity="0.32" filter="url(#ah-a-glow)">
    <path d="M18 78L44 19L78 78" stroke="url(#ah-a-gradient)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 59H67" stroke="url(#ah-a-gradient)" stroke-width="15" stroke-linecap="round"/>
  </g>

  <path d="M18 78L44 19L78 78" stroke="#0D0F14" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 59H67" stroke="#0D0F14" stroke-width="16" stroke-linecap="round"/>
  <path d="M18 78L44 19L78 78" stroke="url(#ah-a-gradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 59H67" stroke="url(#ah-a-gradient)" stroke-width="11" stroke-linecap="round"/>
</svg>
