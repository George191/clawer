<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/astral-helio-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asiral Helio</title>
    <style>
      .sp-auth-boot { position: fixed; inset: 0; z-index: 1000; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: radial-gradient(ellipse at 30% 55%, #0b1925 0%, #03070d 55%, #010306 100%); font-family: system-ui, sans-serif; line-height: 1.5; text-align: center; }
      .sp-auth-boot img { display: block; width: 148px; height: 148px; }
      .sp-auth-boot span { color: #8097b7; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      @media (max-width: 960px) { .sp-auth-boot { display: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sp-auth-boot" role="status" aria-live="polite">
        <img src="/space/auth-loading.svg" width="148" height="148" alt="" aria-hidden="true" />
        <span>Preparing orbital view</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
