name: nga_navwarn
display_name: "NGA - {navarea_id} active navigational warnings"
base_url: "https://msi.nga.mil"
data_type: navwarn
adapter: nga_navwarn
anti_crawl_enabled: false
description: >
  Collect active NGA SMAPS navigational warnings from the verified JSON API.

batch_params:
  file_path: "data/nga_navarea_ids.txt"
  param_name: "navarea_id"
  batch_size: 1
  start_line: 0
  limit: null
  delay: 3

params:
  - name: navarea_id
    description: "NGA message area: 4, 12, A, P, or C"
    required: true

# The queryResults URL is only a React shell. This is its real data endpoint.
response_type: json
json_item_path: "smaps"
list_page: "/api/publications/smaps?navArea={navarea_id}&status=active&category=14&output=html"
list_request:
  method: GET
  headers:
    Accept: "application/json, text/plain, */*"
    Referer: "https://msi.nga.mil/queryResults?publications/smaps"
    Cache-Control: "no-cache"
    Connection: "close"
  encoding: utf-8

dedup_fields:
  - outgoing_id

list_fields:
  - name: outgoing_id
    selector: "outgoingID"
    selector_type: json
    field_type: text
    required: true
  - name: warning_no
    selector: "msgSqncNumber"
    selector_type: json
    field_type: text
    required: true
  - name: category
    selector: "category"
    selector_type: json
    field_type: text
    required: false
  - name: dnc_region
    selector: "dncRegion"
    selector_type: json
    field_type: text
    required: false
  - name: navarea
    selector: "msgType"
    selector_type: json
    field_type: text
    required: false
  - name: oceans
    selector: "oceans"
    selector_type: json
    field_type: text
    required: false
  - name: subregion
    selector: "subRegion"
    selector_type: json
    field_type: text
    required: false
  - name: status
    selector: "status"
    selector_type: json
    field_type: text
    required: true
  - name: latitude
    selector: "latitude"
    selector_type: json
    field_type: number
    required: false
  - name: longitude
    selector: "longitude"
    selector_type: json
    field_type: number
    required: false
  - name: message_text
    selector: "msgText"
    selector_type: json
    field_type: text
    required: true
  - name: issue_time
    selector: "createdOn"
    selector_type: json
    field_type: text
    required: true

# All supported areas:
# python -m app.crawler.main --template-name nga_navwarn --list-file data/nga_navarea_ids.txt --list-param navarea_id --batch-size 1 --delay 3
