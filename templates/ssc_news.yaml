name: ssc_news
display_name: "SSC Space Force Newsroom"
base_url: "https://www.ssc.spaceforce.mil"
data_type: news
adapter: ssc_news
anti_crawl_enabled: false
description: >
  采集 U.S. Space Systems Command (SSC) 新闻室文章。
  列表页提取标题、日期、摘要、详情页链接；
  详情页提取正文和外链。

  页面结构:
    article.article-listing-item
      div.summary
        time[datetime]  → 日期
        h1 a            → 标题 + 链接
        p               → 摘要
      div.thumb
        a img           → 缩略图

response_type: html

list_page: "/Newsroom?Page={page}"
list_request:
  method: GET
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.9"
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
  encoding: utf-8

list_fields:
  - name: title
    selector: "article.article-listing-item h1 a"
    selector_type: css
    field_type: text
    required: true
    transform: strip
    description: "新闻标题"

  - name: url
    selector: "article.article-listing-item h1 a"
    selector_type: css
    field_type: href
    required: true
    description: "详情页链接"

  - name: date
    selector: "article.article-listing-item time"
    selector_type: css
    field_type: text
    required: false
    transform: strip
    description: "发布日期"

  - name: summary
    selector: "article.article-listing-item .summary p"
    selector_type: css
    field_type: text
    required: false
    transform: strip
    description: "新闻摘要"

  - name: thumbnail
    selector: "article.article-listing-item .thumb img"
    selector_type: css
    field_type: src
    required: false
    description: "缩略图"

list_pagination:
  type: next_page
  next_selector: "a:contains('Next'), .pagination .next a, li.next a"
  start_page: 1
  max_pages: 0
  results_per_page: 10

# 详情页：用列表记录中的 url 字段进入详情页
detail_page: "{url}"
detail_request:
  method: GET
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.9"
  encoding: utf-8

detail_fields:
  - name: content
    selector: "section.article-detail-content, .article-content, .article-body"
    selector_type: css
    field_type: text
    required: false
    description: "正文内容"

# python -m app.crawler.main --template ssc_news
