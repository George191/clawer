name: blacksky_news
display_name: "BlackSky - 媒体报道 (Media Coverage)"
base_url: "https://blacksky.com"
data_type: news
adapter: blacksky_news
anti_crawl_enabled: false
description: >
  采集 BlackSky 媒体报道（外部新闻源对 BlackSky 的报道）。
  使用 WordPress REST API 翻页，自定义文章类型: news (rest_base=news)。

  特点:
  - content.rendered 为空，实际内容在外部站点
  - 有 sources 分类（如 Via Satellite, Space News 等）
  - link 指向站内 /media-coverage/ 页面
  - 外链在 HTML 列表页 /company/news/ 的 article.article-summary.news h3 a 中
  - adapter 中通过 HTML 列表页匹配外链 + WP Media API 获取封面图

response_type: json
json_item_path: ""
json_total_path: ""

list_page: "/wp-json/wp/v2/news?per_page={num}&page={page}&_fields=id,date,modified,slug,link,title,sources,featured_media"
list_request:
  method: GET
  headers:
    Accept: "application/json"
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
  encoding: utf-8

dedup_fields:
  - id
  - url

list_fields:
  - name: id
    selector: "id"
    selector_type: json
    field_type: number
    required: true
    description: "WordPress post ID"

  - name: title
    selector: "title.rendered"
    selector_type: json
    field_type: text
    required: true
    transform: strip
    description: "新闻标题"

  - name: url
    selector: "link"
    selector_type: json
    field_type: text
    required: false
    description: "站内详情页链接 (/media-coverage/...)"

  - name: date
    selector: "date"
    selector_type: json
    field_type: text
    required: false
    description: "发布日期 (ISO 8601)"

  - name: modified
    selector: "modified"
    selector_type: json
    field_type: text
    required: false
    description: "最后修改日期 (ISO 8601)"

  - name: slug
    selector: "slug"
    selector_type: json
    field_type: text
    required: false
    description: "URL slug"

  - name: source_ids
    selector: "sources"
    selector_type: json
    field_type: json
    required: false
    description: "来源分类 ID 列表（adapter 中转换为 source_names）"

  - name: featured_media
    selector: "featured_media"
    selector_type: json
    field_type: number
    required: false
    description: "封面图 media ID（0 表示无封面图，adapter 中通过 WP Media API 获取 URL）"

list_pagination:
  type: page_number
  start_page: 1
  max_pages: 0
  results_per_page: 20

download:
  - selector: "featured_media.source_url"
    selector_type: json
    link_type: src
    description: "媒体报道封面图，adapter 通过 WP Media API 回填"
    asset_type: image

  - selector: "attachments"
    selector_type: json
    link_type: href
    description: "外部来源文章中的附件资源"
    asset_type: attachment

  - selector: "images"
    selector_type: json
    link_type: src
    description: "外部来源文章中的图片资源"
    asset_type: image
    
# python -m app.crawler.main --template blacksky_news
